  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f4ef;
      --surface: rgba(255, 255, 255, .58);
      --ink: #111510;
      --muted: #4d554c;
      --line: rgba(17, 21, 16, .18);
      --line-strong: rgba(17, 21, 16, .34);
      --accent: #005dff;
      --accent-soft: rgba(0, 93, 255, .13);
      --grid: rgba(17, 21, 16, .065);
      --shadow: rgba(17, 21, 16, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080a09;
        --surface: rgba(18, 22, 19, .68);
        --ink: #eef5ed;
        --muted: #9ca89b;
        --line: rgba(238, 245, 237, .16);
        --line-strong: rgba(238, 245, 237, .33);
        --accent: #b9ff3d;
        --accent-soft: rgba(185, 255, 61, .12);
        --grid: rgba(238, 245, 237, .055);
        --shadow: rgba(0, 0, 0, .45);
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f2f4ef;
      --surface: rgba(255, 255, 255, .58);
      --ink: #111510;
      --muted: #4d554c;
      --line: rgba(17, 21, 16, .18);
      --line-strong: rgba(17, 21, 16, .34);
      --accent: #005dff;
      --accent-soft: rgba(0, 93, 255, .13);
      --grid: rgba(17, 21, 16, .065);
      --shadow: rgba(17, 21, 16, .12);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #080a09;
      --surface: rgba(18, 22, 19, .68);
      --ink: #eef5ed;
      --muted: #9ca89b;
      --line: rgba(238, 245, 237, .16);
      --line-strong: rgba(238, 245, 237, .33);
      --accent: #b9ff3d;
      --accent-soft: rgba(185, 255, 61, .12);
      --grid: rgba(238, 245, 237, .055);
      --shadow: rgba(0, 0, 0, .45);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg); }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: clamp(34px, 5vw, 72px) clamp(34px, 5vw, 72px);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
    }

    button { font: inherit; }

    .page {
      position: relative;
      min-height: 100svh;
      isolation: isolate;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      padding: max(22px, env(safe-area-inset-top)) clamp(20px, 4.5vw, 72px) max(24px, env(safe-area-inset-bottom));
    }

    .page::before {
      content: "";
      position: absolute;
      z-index: -2;
      width: min(72vw, 1020px);
      aspect-ratio: 1;
      right: min(-25vw, -120px);
      top: 50%;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow:
        0 0 0 clamp(54px, 8vw, 120px) var(--accent-soft),
        0 0 0 clamp(55px, 8.1vw, 122px) var(--line),
        0 0 0 clamp(150px, 19vw, 280px) transparent,
        0 0 0 clamp(151px, 19.1vw, 282px) var(--line);
    }

    .scan {
      position: absolute;
      z-index: -1;
      inset: -15% 0 auto;
      height: 30%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, var(--accent-soft), transparent);
      animation: scan 7s linear infinite;
    }

    @keyframes scan { to { transform: translateY(450%); } }

    .topline,
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      line-height: 1;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .topline { justify-content: flex-end; }

    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .signal {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      white-space: nowrap;
    }

    .signal-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 var(--accent-soft);
      animation: ping 2.4s ease-out infinite;
    }

    @keyframes ping {
      0%, 35% { box-shadow: 0 0 0 0 var(--accent-soft); }
      75%, 100% { box-shadow: 0 0 0 11px transparent; }
    }

    .motion-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 0;
      padding: 8px 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .motion-toggle:hover,
    .motion-toggle:focus-visible { color: var(--ink); }

    .motion-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    .pause-mark {
      position: relative;
      width: 12px;
      height: 12px;
      border: 1px solid currentColor;
      border-radius: 50%;
    }

    .pause-mark::before,
    .pause-mark::after {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      width: 1px;
      background: currentColor;
    }

    .pause-mark::before { left: 4px; }
    .pause-mark::after { right: 4px; }

    .theme-mark {
      width: 12px;
      height: 12px;
      border: 1px solid currentColor;
      border-radius: 50%;
      box-shadow: inset -4px 0 0 currentColor;
    }

    .hero {
      align-self: center;
      width: min(1040px, 100%);
      padding: clamp(64px, 10vh, 124px) 0 clamp(54px, 9vh, 108px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 24px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: clamp(10px, 1vw, 12px);
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 36px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(62px, 13.5vw, 190px);
      font-weight: 800;
      line-height: .77;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }

    h1 span {
      position: relative;
      display: inline-block;
      margin-left: clamp(26px, 10vw, 150px);
      color: transparent;
      -webkit-text-stroke: clamp(1px, .11vw, 2px) var(--ink);
    }

    h1 span::after {
      content: "";
      position: absolute;
      left: -.01em;
      bottom: -.15em;
      width: .82em;
      height: .035em;
      background: var(--accent);
    }

    .hero-bottom {
      display: grid;
      grid-template-columns: minmax(230px, 430px) minmax(220px, 1fr);
      gap: clamp(38px, 8vw, 120px);
      align-items: end;
      margin-top: clamp(48px, 8vh, 92px);
      margin-left: clamp(0px, 17vw, 250px);
    }

    .lede {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 27px);
      line-height: 1.32;
      letter-spacing: -.025em;
    }

    .sequence {
      border-top: 1px solid var(--line-strong);
      padding-top: 14px;
    }

    .sequence-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-family: "DM Mono", monospace;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .sequence-track {
      position: relative;
      height: 4px;
      margin-top: 18px;
      overflow: hidden;
      background: var(--line);
    }

    .sequence-track::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 34%;
      background: var(--accent);
      animation: calibrate 3.8s ease-in-out infinite alternate;
    }

    @keyframes calibrate {
      from { transform: translateX(-55%); }
      to { transform: translateX(245%); }
    }

    .footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .footer p { margin: 0; }

    .paused *,
    .paused *::before,
    .paused *::after { animation-play-state: paused !important; }

    @media (max-width: 680px) {
      .page {
        padding-inline: 20px;
      }

      .topline { justify-content: flex-end; }

      .hero {
        padding-top: clamp(66px, 11vh, 100px);
      }

      h1 {
        font-size: clamp(69px, 23vw, 112px);
        line-height: .8;
      }

      h1 span { margin-left: 0; }

      .hero-bottom {
        grid-template-columns: 1fr;
        gap: 34px;
        margin-top: 54px;
        margin-left: 0;
      }

      .sequence { width: min(100%, 360px); }

      .footer {
        align-items: flex-end;
        font-size: 9px;
      }

      .page::before {
        width: 118vw;
        right: -73vw;
        top: 44%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
      #motionToggle { display: none; }
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="scan" aria-hidden="true"></div>

    <div class="topline">
      <div class="controls">
        <button class="motion-toggle" id="themeToggle" type="button">
          <span class="theme-mark" aria-hidden="true"></span>
          <span id="themeLabel">Dark mode</span>
        </button>
        <button class="motion-toggle" id="motionToggle" type="button" aria-pressed="false">
          <span class="pause-mark" aria-hidden="true"></span>
          <span id="motionLabel">Pause motion</span>
        </button>
      </div>
    </div>

    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">Transmission incoming</p>
      <h1 id="headline">Coming<br><span>Soon</span></h1>

      <div class="hero-bottom">
        <p class="lede">A new signal is taking shape. The future is almost within reach.</p>
        <div class="sequence" aria-label="Launch sequence calibrating">
          <div class="sequence-meta">
            <span>Launch sequence</span>
            <span>Calibrating</span>
          </div>
          <div class="sequence-track" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <p class="signal"><span class="signal-dot" aria-hidden="true"></span>Link active · Jagroop Singh Gill</p>
    </footer>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var page = document.getElementById('page');
      var toggle = document.getElementById('motionToggle');
      var label = document.getElementById('motionLabel');
      var themeToggle = document.getElementById('themeToggle');
      var themeLabel = document.getElementById('themeLabel');
      var darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

      function isDark() {
        return root.dataset.theme ? root.dataset.theme === 'dark' : darkQuery.matches;
      }

      function updateThemeLabel() {
        var dark = isDark();
        themeLabel.textContent = dark ? 'Light mode' : 'Dark mode';
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }

      themeToggle.addEventListener('click', function () {
        root.dataset.theme = isDark() ? 'light' : 'dark';
        updateThemeLabel();
      });

      if (darkQuery.addEventListener) {
        darkQuery.addEventListener('change', updateThemeLabel);
      }

      toggle.addEventListener('click', function () {
        var paused = page.classList.toggle('paused');
        toggle.setAttribute('aria-pressed', String(paused));
        label.textContent = paused ? 'Resume motion' : 'Pause motion';
      });

      updateThemeLabel();
    }());
  </script>
</body>
</html>
